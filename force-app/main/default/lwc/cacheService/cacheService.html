<!-- clearCache.html -->
<template>
    <!-- Full-screen Spinner Overlay -->
    <template if:true={isLoading}>
        <div class="spinner-overlay">
            <div class="spinner-container">
                <lightning-spinner 
                    alternative-text="Processing..." 
                    variant="brand" 
                    size="large">
                </lightning-spinner>
                <p class="spinner-text">Processing your request...</p>
            </div>
        </div>
    </template>

    <lightning-card icon-name="custom:custom93" title="Clear Cache Options" class="slds-is-relative compact-card">
        <!-- Main Content -->
        <div class="slds-p-around_medium">
            <!-- Cache Type Selection - Compact Grid -->
            <div class="options-grid">
                <template for:each={cacheOptions} for:item="option">
                    <div key={option.value} class="option-item">
                        <button class={option.cardClass} data-value={option.value} onclick={handleOptionSelect}>
                            <lightning-icon icon-name={option.icon} size="small" class="slds-m-bottom_xxx-small"></lightning-icon>
                            <span class="option-label">{option.label}</span>
                        </button>
                    </div>
                </template>
            </div>

            <!-- Selected Option Indicator - Modern Pill -->
            <template if:true={selectedOption}>
                <div class="slds-p-vertical_small">
                    <div class="slds-grid slds-wrap slds-gutters_medium slds-align_absolute-center">
                        <span class="selected-pill">
                            <lightning-icon icon-name="utility:check" size="xx-small" class="slds-m-right_xxx-small" variant="inverse"></lightning-icon>
                            <span>{selectedOptionLabel}</span>
                            <button class="clear-selection-btn" onclick={clearSelection} title="Change selection">
                                <lightning-icon icon-name="utility:close" size="xx-small" variant="inverse"></lightning-icon>
                            </button>
                        </span>
                    </div>
                </div>
            </template>

            <!-- File Upload Section -->
            <template if:true={selectedOption}>
                <div class="upload-section slds-p-vertical_medium">
                    <lightning-file-upload 
                        style="text-align: center;" 
                        label="" 
                        name="fileUploader" 
                        accept=".csv"
                        record-id={recordId} 
                        onuploadfinished={handleFileUploaded} 
                        disabled={isFileUploaded}
                        class="compact-file-upload">
                        <div class="upload-placeholder">
                            <lightning-icon icon-name="utility:upload" size="small" class="slds-m-bottom_xxx-small">
                            </lightning-icon>
                            <p class="slds-text-body_small"><strong>Upload CSV File</strong></p>
                            <p class="slds-text-body_small slds-text-color_weak">Only CIF column required</p>
                        </div>
                    </lightning-file-upload>
                </div>
            </template>

            <!-- Preview Section -->
            <template if:true={cifList.length}>
                <div class="preview-section slds-p-vertical_medium">
                    <div class="slds-grid slds-grid_align-spread slds-p-bottom_x-small">
                        <h3 class="slds-text-body_small">
                            <strong>Loaded CIFs</strong> · {cifList.length} records
                        </h3>
                        <button class="clear-link" onclick={clearFile}>Clear all</button>
                    </div>

                    <div class="preview-table-wrapper">
                        <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_striped compact-table">
                            <thead>
                                <tr class="slds-text-title_caps">
                                    <th scope="col" style="width: 20%; text-align: center;">#</th>
                                    <th scope="col" style="width: 80%; text-align: center;">CIF</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={cifList} for:item="cif" for:index="idx">
                                    <tr key={cif}>
                                        <td class="slds-text-align_center">{idx + 1}</td>
                                        <td class="slds-text-align_center">
                                            <lightning-formatted-text value={cif}></lightning-formatted-text>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- Action Buttons -->
                    <div class="slds-p-top_medium slds-text-align_center">
                        <lightning-button 
                            label="Clear Cache" 
                            variant="brand" 
                            onclick={handleClearCache}
                            disabled={isProcessing} 
                            class="action-button">
                        </lightning-button>
                        <lightning-button 
                            label="Cancel" 
                            variant="neutral" 
                            onclick={handleCancel}
                            class="action-button slds-m-left_x-small">
                        </lightning-button>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
