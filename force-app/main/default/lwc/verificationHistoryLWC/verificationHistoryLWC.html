<template>
    <div style="width: auto;">
            <template lwc:if={showTable}>
                <lightning-datatable data={dataToDisplay}
                                     columns={columns}
                                     key-field="id"
									 sorted-by={sortBy}
                                     sorted-direction={sortDirection}
									 default-sort-direction="desc"
                                     hide-checkbox-column="true"
                                     ></lightning-datatable>
            </template>
        </div>
</template>
