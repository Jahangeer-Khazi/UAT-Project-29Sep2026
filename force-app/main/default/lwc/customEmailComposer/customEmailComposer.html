<template>

    <lightning-card title="">

        <template if:false={showEmailComposer}>
        <div class="slds-var-p-around_medium">
            <button onclick={handleEmailButtonClicked}
                style="background: white;border: 1px solid #c9c9c9;border-radius: 5px;padding: 5px;width: 100%;color: #747474;">
                Write an email...
            </button>
        </div>

        

        </template>
        <template if:true={showEmailComposer}>
            <div class="slds-var-p-around_medium">
                <lightning-input 
                    label="To" 
                    name="toAddress" 
                    value={toAddress}
                    type="email" 
                    onchange={handleChange} readonly>
                </lightning-input>

                <lightning-input 
                    label="Cc" 
                    name="ccAddress" 
                    value={ccAddress}
                    type="email" 
                    onchange={handleChange} >
                </lightning-input>

                <lightning-input 
                    label="Subject" 
                    name="subject" 
                    value={subject} 
                    onchange={handleChange} required>
                </lightning-input>

                <label class="slds-form-element__label" for="emailBody">Body</label>
                
                <div contenteditable="true" class="htmlTemplateContainer cke_editable" lwc:dom="manual" style="max-height:300px;overflow-y:scroll;"></div>
                <lightning-button variant="base" label="Reset Template Content" title="Reset Body Template" onclick={handleResetTemplateClick} class="slds-m-left_x-small"></lightning-button>
                <!--<lightning-input-rich-text slds-textarea
                    class="slds-m-around_none slds-p-around_none"
                    id="emailBody"
                    label="Body"
                    name="body"
                    value={body}
                    onchange={handleChange}
                    toolbar-config={toolbarConfig}>
                </lightning-input-rich-text>-->


                <template if:true={errorMessage}>
                    <div class="slds-text-color_error slds-m-top_small">{errorMessage}</div>
                </template>

                <template if:true={successMessage}>
                    <div class="slds-text-color_success slds-m-top_small">{successMessage}</div>
                </template>
                <div>&nbsp;</div>
                <lightning-button 
                    class="slds-m-top_medium" 
                    label="Send Email" 
                    variant="brand" 
                    onclick={handleSend}>
                </lightning-button>
            </div>
        </template>
        <template if:false={isCustomerAssociatedWithRecord}>
            <div class="slds-text-color_error slds-m-top_small">Customer field is not populated. Please populate the customer field first.</div>
        </template>
    </lightning-card>
</template>
