<template>
    <lightning-card title="Social Media Leads Viewer" icon-name="standard:lead_list">

        <!-- Card Actions -->
        <div slot="actions">
            <template if:false={isTableVisible}>
                <lightning-button label="View Social Media Leads" variant="brand" icon-name="utility:preview"
                    onclick={handleViewLeads}>
                </lightning-button>
            </template>
            <template if:true={isTableVisible}>
                <lightning-button label="Assign Sales agent" variant="brand" icon-name="utility:user"
                    onclick={handleOpenAssignModal} class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button label="Refresh" variant="neutral" icon-name="utility:refresh" onclick={handleRefresh}
                    class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button label="Hide Table" variant="neutral" icon-name="utility:close"
                    onclick={handleHideTable}>
                </lightning-button>
            </template>
        </div>

        <div class="slds-p-around_medium">

            <!-- Loading Spinner (Main) -->
            <template if:true={isMainLoading}>
                <div class="slds-m-vertical_large slds-is-relative" style="height: 100px;">
                    <lightning-spinner alt-text="Loading..." size="medium" variant="brand"></lightning-spinner>
                </div>
            </template>

            <!-- Error Message -->
            <template if:true={errorMessage}>
                <div class="slds-m-top_medium">
                    <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                        <span class="slds-assistive-text">Error</span>
                        <div class="slds-notify__content">
                            <h2 class="slds-text-heading_small">{errorMessage}</h2>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Results Table -->
            <template if:true={isTableVisible}>
                <div class="slds-m-top_medium">

                    <!-- Filters Bar -->
                    <lightning-layout vertical-align="end" multiple-rows class="slds-m-bottom_small">
                        <lightning-layout-item size="12" medium-device-size="3" padding="around-small">
                            <lightning-combobox label="Owner Filter" value={stageOwnerFilter} options={ownerOptions}
                                onchange={handleOwnerFilterChange}>
                            </lightning-combobox>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" medium-device-size="2" padding="around-small">
                            <lightning-combobox label="Records on page" value={stagePageSize} options={pageSizeOptions}
                                onchange={handlePageSizeChange}>
                            </lightning-combobox>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" medium-device-size="5" padding="around-small">
                            <lightning-input type="search" label="Search Leads"
                                placeholder="Search by name, email, phone, CIF..." value={stageSearchTerm}
                                onchange={handleSearch}>
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" medium-device-size="2" padding="around-small">
                            <lightning-button label="Apply Search" variant="brand" icon-name="utility:search"
                                onclick={handleApplyFilters} class="slds-button_full-width"
                                disabled={isApplyMainDisabled}>
                            </lightning-button>
                        </lightning-layout-item>
                    </lightning-layout>

                    <!-- Table Header / Record Count -->
                    <div class="slds-page-header slds-page-header_joined">
                        <div class="slds-page-header__row">
                            <div class="slds-page-header__col-title">
                                <div class="slds-media">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="utility:table" size="small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <div class="slds-page-header__name">
                                            <div class="slds-page-header__name-title">
                                                <h1>
                                                    <span class="slds-page-header__title slds-truncate"
                                                        title="Social Media Leads">Social Media Leads</span>
                                                </h1>
                                            </div>
                                        </div>
                                        <p class="slds-page-header__name-meta">
                                            {recordCountLabel}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Data Table -->
                    <div style="height: 500px;" class="slds-is-relative">
                        <template if:true={isMainLoading}>
                            <div class="slds-overlay slds-overlay_container"
                                style="background: transparent; z-index: 100;">
                                <lightning-spinner alt-text="Syncing..." size="small"
                                    variant="brand"></lightning-spinner>
                            </div>
                        </template>
                        <lightning-datatable key-field="Id" data={pagedData} columns={columns} show-row-number-column
                            hide-checkbox-column class="slds-table_bordered slds-table_col-bordered"
                            sorted-by={sortedBy} sorted-direction={sortedDirection} onsort={handleSort}>
                        </lightning-datatable>
                    </div>

                    <!-- Pagination Controls -->
                    <div class="slds-m-top_medium slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                        <lightning-button label="Previous" icon-name="utility:chevronleft" onclick={handlePreviousPage}
                            disabled={isFirstPage} variant="neutral" class="slds-m-right_x-small">
                        </lightning-button>
                        <span class="slds-text-title_bold slds-m-horizontal_medium">
                            Page {currentPage} of {totalPages}
                        </span>
                        <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right"
                            onclick={handleNextPage} disabled={isLastPage} variant="neutral"
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </div>

                </div>
            </template>

            <!-- Empty State -->
            <template if:true={showEmptyState}>
                <div class="slds-m-top_medium">
                    <div class="slds-illustration slds-illustration_small slds-text-align_center slds-p-vertical_large">
                        <p class="slds-text-body_regular slds-text-color_weak">
                            No social media lead records found.
                        </p>
                    </div>
                </div>
            </template>

        </div>

    </lightning-card>

    <!-- Assignment Modal -->
    <template if:true={isAssignModalOpen}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <!-- <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={handleCloseAssignModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button> -->
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Assign Sales Agent</h2>
                    <lightning-button-icon icon-name="utility:refresh" variant="bare" onclick={handleAssignmentRefresh}
                        alternative-text="Refresh modal data" title="Refresh" class="slds-m-left_small">
                    </lightning-button-icon>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">

                    <!-- Modal Filters Bar -->
                    <lightning-layout vertical-align="end" multiple-rows class="slds-m-bottom_medium">
                        <lightning-layout-item size="12" medium-device-size="3" padding="horizontal-small">
                            <lightning-combobox label="Owner Filter" value={stageAssignmentOwnerFilter}
                                options={ownerOptions} onchange={handleAssignmentOwnerFilterChange}>
                            </lightning-combobox>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" medium-device-size="2" padding="horizontal-small">
                            <lightning-combobox label="Records" value={stageAssignmentPageSize}
                                options={pageSizeOptions} onchange={handleAssignmentPageSizeChange}>
                            </lightning-combobox>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" medium-device-size="5" padding="horizontal-small">
                            <lightning-input type="search" label="Search Unassigned" placeholder="Search Name, CIF..."
                                value={stageAssignmentSearchTerm} onchange={handleAssignmentSearch}>
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" medium-device-size="2" padding="horizontal-small">
                            <lightning-button label="Apply" variant="brand" icon-name="utility:filter"
                                onclick={handleApplyAssignmentFilters} class="slds-button_full-width"
                                disabled={isApplyAssignmentDisabled}>
                            </lightning-button>
                        </lightning-layout-item>
                    </lightning-layout>

                    <!-- Agent Selection (Sticky header style) -->
                    <div class="slds-m-bottom_medium slds-p-around_small slds-theme_shade slds-box slds-box_x-small">
                        <lightning-record-edit-form object-api-name="Social_Media_Leads__c">
                            <lightning-input-field field-name="Sales_Agent__c" label="Assign To Agent"
                                onchange={handleAgentChange} variant="label-stacked" class="slds-m-bottom_none">
                            </lightning-input-field>
                        </lightning-record-edit-form>
                    </div>

                    <!-- Unassigned Leads Table -->
                    <div style="height: 350px;" class="slds-m-bottom_small slds-is-relative">
                        <template if:true={isAssignmentLoading}>
                            <div class="slds-overlay slds-overlay_container"
                                style="background-color: rgba(255,255,255,0.5); z-index: 100;">
                                <lightning-spinner alt-text="Searching..." size="small"
                                    variant="brand"></lightning-spinner>
                            </div>
                        </template>
                        <lightning-datatable key-field="Id" data={assignmentPagedData} columns={columns}
                            class="slds-table_bordered slds-table_col-bordered"
                            onrowselection={handleAssignmentRowSelection}>
                        </lightning-datatable>
                    </div>

                    <!-- Modal Pagination controls -->
                    <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                        <lightning-button label="Previous" icon-name="utility:chevronleft"
                            onclick={handleAssignmentPrev} disabled={isAssignmentFirstPage} variant="neutral"
                            class="slds-m-right_x-small">
                        </lightning-button>
                        <span class="slds-text-title_bold">
                            Page {assignmentCurrentPage} of {assignmentTotalPages}
                        </span>
                        <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right"
                            onclick={handleAssignmentNext} disabled={isAssignmentLastPage} variant="neutral"
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCloseAssignModal}
                        class="slds-m-right_x-small"></lightning-button>
                    <lightning-button variant="brand" label="Assign" onclick={handleConfirmAssignment}
                        disabled={isAssignDisabled}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
