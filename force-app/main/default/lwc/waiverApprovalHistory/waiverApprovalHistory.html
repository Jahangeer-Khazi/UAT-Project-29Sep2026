            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>
        <div>
            <lightning-datatable
                key-field="Id"
                data={waiverAppovalHistories}
                columns={columns}
                hide-checkbox-column>

        </div>
    </lightning-card>
</template>
