<template>
    <lightning-card title="CRIF Report Requests" icon-name="standard:report">
        <div slot="actions">
            <lightning-button label="Export CRIF Requests" onclick={handleExport}
                disabled={isLoading}></lightning-button>
        </div>

        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alt-name="Loading" size="medium"></lightning-spinner>
            </template>

            <!-- Diagnostic info for testing -->
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <h2>Error: {error.message}</h2>
                </div>
            </template>
            <template if:false={cif}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_warning" role="alert">
                    <h2>Warning: No CIF found on this record. Showing mock data for testing.</h2>
                </div>
            </template>

            <template if:false={isLoading}>
                <lightning-tabset variant="scoped">
                    <!-- Active Requests Tab -->
                    <lightning-tab label={activeTabLabel}>
                        <template if:true={hasActiveReports}>
                            <div class="slds-scrollable_x">
                                <table
                                    class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th class="" scope="col">
                                                <div class="slds-truncate" title="Status">Report Status</div>
                                            </th>
                                            <th class="" scope="col">
                                                <div class="slds-truncate" title="Date">Report request date and time
                                                </div>
                                            </th>
                                            <th class="" scope="col">
                                                <div class="slds-truncate" title="Reference">Report reference number
                                                </div>
                                            </th>
                                            <th class="" scope="col">
                                                <div class="slds-truncate" title="Expiry">Report expiry date</div>
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={activeReports} for:item="report">
                                            <tr key={report.refNo} class="slds-hint-parent">
                                                <td data-label="Status">
                                                    <div class={report.statusClass}>
                                                        {report.statusLabel}
                                                    </div>
                                                </td>
                                                <td data-label="Date">
                                                    <div class="slds-truncate">{report.formattedGenerateDate}</div>
                                                </td>
                                                <td data-label="Reference">
                                                    <div class="slds-truncate">{report.refNo}</div>
                                                </td>
                                                <td data-label="Expiry">
                                                    <div class="slds-truncate">{report.formattedExpiryDate}</div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                        <template if:false={hasActiveReports}>
                            <div class="slds-align_absolute-center slds-m-around_large">
                                <p>No active CRIF reports</p>
                            </div>
                        </template>
                    </lightning-tab>

                    <!-- Expired Requests Tab -->
                    <lightning-tab label={expiredTabLabel}>
                        <template if:true={hasExpiredReports}>
                            <div class="slds-scrollable_x">
                                <table
                                    class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th class="" scope="col">
                                                <div class="slds-truncate" title="Status">Report Status</div>
                                            </th>
                                            <th class="" scope="col">
                                                <div class="slds-truncate" title="Date">Report request date and time
                                                </div>
                                            </th>
                                            <th class="" scope="col">
                                                <div class="slds-truncate" title="Reference">Report reference number
                                                </div>
                                            </th>
                                            <th class="" scope="col">
                                                <div class="slds-truncate" title="Expiry">Report expiry date</div>
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={expiredReports} for:item="report">
                                            <tr key={report.refNo} class="slds-hint-parent">
                                                <td data-label="Status">
                                                    <div class={report.statusClass}>
                                                        {report.statusLabel}
                                                    </div>
                                                </td>
                                                <td data-label="Date">
                                                    <div class="slds-truncate">{report.formattedGenerateDate}</div>
                                                </td>
                                                <td data-label="Reference">
                                                    <div class="slds-truncate">{report.refNo}</div>
                                                </td>
                                                <td data-label="Expiry">
                                                    <div class="slds-truncate">{report.formattedExpiryDate}</div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                        <template if:false={hasExpiredReports}>
                            <div class="slds-align_absolute-center slds-m-around_large">
                                <p>No expired CRIF reports</p>
                            </div>
                        </template>
                    </lightning-tab>
                </lightning-tabset>
            </template>
        </div>
    </lightning-card>

    <!-- PDF Modal -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">CRIF Report Export</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1" style="height: 80vh;">
                    <iframe src={pdfUrl} width="100%" height="100%" frameborder="0"></iframe>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal}>Close</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
