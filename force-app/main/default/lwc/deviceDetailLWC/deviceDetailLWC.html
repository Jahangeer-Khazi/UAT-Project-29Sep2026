<template>
    <!-- Spinner -->
    <template lwc:if={isLoading}>
        <lightning-spinner
            alternative-text="Loading Device Details"
            size="medium">
        </lightning-spinner>
    </template>
    <!-- Spinner -->

    <!-- Content after Apex completes -->
    <template lwc:else>
        <template lwc:if={hasDeviceData}>
            <lightning-datatable
                    key-field="id"
                    data={deviceData}
                    columns={columns}
                    hide-checkbox-column>
            </lightning-datatable>
        </template>
        <template lwc:else>
            <div class="slds-m-bottom_medium slds-text-color_error slds-text-title_bold">
                No Device Details found for customer : {customerCIF}
            </div>
        </template>
    </template>
    <!-- Content after Apex completes -->
   <br/>
</template>
